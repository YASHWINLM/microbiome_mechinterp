[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q2_mechinterp"
version = "0.3.0"
description = "VAE-based feature engineering for microbiome and transcriptomics data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Leo Joseph", email = "l1joseph@ucsd.edu"}
]
keywords = [
    "variational-autoencoder",
    "vae",
    "feature-engineering",
    "microbiome",
    "metagenomics",
    "metatranscriptomics",
    "transcriptomics",
    "sparse-autoencoder",
    "dimensionality-reduction",
    "deep-learning",
    "batch-correction",
    "hyperparameter-tuning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "tqdm>=4.62.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
microbiome = [
    "biom-format>=2.1.0",
    "biopython>=1.79",
]
visualization = [
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "umap-learn>=0.5.0",
]
ml = [
    "xgboost>=1.5.0",
    "lightgbm>=3.3.0",
]
tuning = [
    "optuna>=3.0.0",
]
all = [
    "biom-format>=2.1.0",
    "biopython>=1.79",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "umap-learn>=0.5.0",
    "xgboost>=1.5.0",
    "lightgbm>=3.3.0",
    "optuna>=3.0.0",
    "toml>=0.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "pre-commit>=2.17.0",
]

[project.scripts]
q2-mechinterp = "q2_mechinterp.cli:main"

[project.urls]
Homepage = "https://github.com/l1joseph/microbiome_mechinterp"
Documentation = "https://github.com/l1joseph/microbiome_mechinterp#readme"
Repository = "https://github.com/l1joseph/microbiome_mechinterp"
Issues = "https://github.com/l1joseph/microbiome_mechinterp/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["q2_mechinterp*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["q2_mechinterp"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=q2_mechinterp --cov-report=term-missing"
