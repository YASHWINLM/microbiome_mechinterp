[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microbiome-mechinterp"
version = "0.1.0"
description = "Microbiome mechanistic interpretability using VAE and Sparse Autoencoders"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "torch>=1.9.0",
    "scikit-learn>=0.24.0",
    "biom-format>=2.1.0",
    "qiime2>=2023.5",
    "gemelli",
    "pyyaml>=5.4.0",
    "umap-learn>=0.5.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
]

[project.scripts]
microbiome-mechinterp = "microbiome_mechinterp.cli:main"
